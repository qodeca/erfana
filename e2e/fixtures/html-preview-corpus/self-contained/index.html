<!DOCTYPE html>
<!--
  Corpus case 1: self-contained.
  All CSS lives in the <style> block, all JS in the inline <script>.
  No external references, no network. Sentinel: the <title> carries "-OK-1",
  read by wc.getTitle() (AC25 sentinel 1). The inline script mutates the DOM
  after load so "JavaScript executed" is visually confirmable.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self-contained corpus page -OK-1</title>
    <style>
      :root {
        --ink: #1b1b1f;
        --accent: #2b6cb0;
      }
      body {
        margin: 0;
        padding: 2rem;
        font: 16px/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: #f6f8fa;
      }
      h1 {
        font-size: 1.4rem;
        color: var(--accent);
      }
      .card {
        max-width: 40rem;
        padding: 1rem 1.25rem;
        background: #fff;
        border: 1px solid #d0d7de;
      }
      #js-output {
        margin-top: 1rem;
        padding: 0.75rem;
        background: #eef6ff;
        border-left: 4px solid var(--accent);
      }
      .pending {
        color: #a00;
      }
      code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Corpus 1: self-contained page</h1>
      <p>
        You should see: this heading styled in blue, and the box below filled in
        by JavaScript with a live timestamp and a computed list. If the box still
        reads "JavaScript has not run yet", the inline script did not execute.
      </p>
      <div id="js-output" class="pending">JavaScript has not run yet.</div>
    </div>

    <script>
      // Mutate the DOM after load so script execution is visually confirmable.
      window.addEventListener('DOMContentLoaded', () => {
        const squares = [1, 2, 3, 4, 5].map((n) => n * n).join(', ')
        const output = document.getElementById('js-output')
        output.classList.remove('pending')
        output.innerHTML =
          '<strong>JavaScript executed.</strong><br />' +
          'Rendered at: <code>' +
          new Date().toISOString() +
          '</code><br />' +
          'Computed squares 1..5: <code>' +
          squares +
          '</code>'
      })
    </script>
  </body>
</html>
