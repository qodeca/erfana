<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hostile – read local files from the page</title>
<link rel="stylesheet" href="/hostile.css">
<script src="/canary.js"></script>
<script src="/file-targets.js"></script>
</head>
<body>
<h1>Read local files from the page</h1>
<p>025-NFR-001 "read local files (from the page)": <code>fetch</code> and <code>XMLHttpRequest</code> of <code>file://</code> URLs. <code>?path=</code> adds the test's canary file.</p>
<output id="result"></output>
<ol id="attempts"></ol>
<script>
  window.__fileTargets.forEach(function (url) {
    window.__canary.attempt('fetch ' + url, function () {
      return fetch(url).then(function (r) { return r.text() })
    })
    window.__canary.attempt('xhr ' + url, function () {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest()
        xhr.open('GET', url)
        xhr.onload = function () { resolve(xhr.responseText) }
        xhr.onerror = function () { reject(new Error('xhr error')) }
        xhr.send()
      })
    })
  })
</script>
</body>
</html>
