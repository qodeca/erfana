<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hostile – call IPC</title>
<link rel="stylesheet" href="/hostile.css">
<script src="/canary.js"></script>
</head>
<body>
<h1>Call Erfana IPC</h1>
<p>025-NFR-001 "call IPC". Every route a page might use to reach an IPC channel. Any truthy answer is a leak.</p>
<output id="result"></output>
<ol id="attempts"></ol>
<script>
  var CHANNELS = ['terminal:create', 'terminal:write', 'file:readFile', 'file:writeFile', 'browser:pick', 'browser:send']
  var a = window.__canary.attempt
  a('window.electron.ipcRenderer', function () { return window.electron && window.electron.ipcRenderer })
  a('window.ipcRenderer', function () { return window.ipcRenderer })
  a('require("electron")', function () { return typeof require === 'function' && require('electron') })
  a('process.electronBinding', function () { return typeof process !== 'undefined' && process.electronBinding })
  a('window.api', function () { return window.api })
  CHANNELS.forEach(function (channel) {
    a('invoke ' + channel, function () {
      var ipc = window.electron && window.electron.ipcRenderer
      return ipc ? ipc.invoke(channel, { cwd: '/', cols: 80, rows: 24, data: 'echo ERFANA-HOSTILE-IPC-7f3a\r' }).then(function (r) { return r || 'answered' }) : null
    })
  })
  // A page cannot post into Erfana's renderer: its only window relations are its own frames and opener.
  window.__canary.note('postMessage to top/parent/opener', 'attempted', 'sent ipc-shaped messages')
  ;[window.top, window.parent, window.opener].forEach(function (target) {
    if (target && target !== window) target.postMessage({ channel: 'terminal:write', args: ['echo ERFANA-HOSTILE-IPC-7f3a\r'] }, '*')
  })
</script>
</body>
</html>
