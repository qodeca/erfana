<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>file:// storage probe a</title></head>
<body>
<h1>file:// storage probe (a)</h1>
<p>025-AC-005: two project HTML files in different folders cannot read each other's localStorage. Each writes <code>probe-a</code> and reports every key it sees in <code>#keys</code>.</p>
<output id="keys"></output>
<script>
  try {
    localStorage.setItem('probe-a', 'written by a')
    document.getElementById('keys').textContent = Object.keys(localStorage).sort().join(',')
  } catch (error) {
    document.getElementById('keys').textContent = 'error:' + error.name
  }
</script>
</body>
</html>
