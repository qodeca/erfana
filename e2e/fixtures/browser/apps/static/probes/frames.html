<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Probe frames</title>
<style>
  html, body { margin: 0; }
  body { width: 820px; height: 600px; background: #e8eaf6; position: relative; overflow: hidden; }
  iframe { position: absolute; border: 0; }
  /* A cross-site frame at an offset. */
  #offset { left: 240px; top: 60px; width: 300px; height: 200px; }
  /* A cross-site frame under a transform: local (fx, fy) -> page (80, 300) + rotate(12deg) * 0.8 * (fx, fy). */
  #transformed { left: 80px; top: 300px; width: 300px; height: 200px; transform: rotate(12deg) scale(0.8); transform-origin: 0 0; }
  /* A same-origin frame. */
  #same { left: 600px; top: 60px; width: 200px; height: 150px; }
  #top-target { position: absolute; left: 600px; top: 300px; width: 150px; height: 100px; background: #c8e6c9; }
</style>
</head>
<body>
<!-- Engine probes (spec 025 commit 8): mouse coordinates in out-of-process frames, crosshair insertCSS. -->
<iframe id="offset" title="offset frame" src="{{origin static http other.test}}/probes/frame.html?name=offset"></iframe>
<iframe id="transformed" title="transformed frame" src="{{origin static http third.test}}/probes/frame.html?name=transformed"></iframe>
<iframe id="same" title="same-origin frame" src="/probes/frame.html?name=same"></iframe>
<div id="top-target"></div>
<script>
  window.__probe = { moves: [] }
  document.addEventListener('mousemove', function (e) {
    window.__probe.moves.push({ x: e.clientX, y: e.clientY, screenX: e.screenX, screenY: e.screenY })
  })
</script>
</body>
</html>
