<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Probe page</title>
<style>
  html, body { margin: 0; }
  body { width: 820px; height: 600px; background: #fafafa; }
  #target { position: absolute; left: 100px; top: 100px; width: 300px; height: 200px; background: #1565c0; }
  #target:hover { background: #2e7d32; }
  #last { position: absolute; left: 100px; top: 400px; }
  #first { position: absolute; left: 100px; top: 360px; }
</style>
</head>
<body>
<!--
  Engine probes (spec 025 commit 8): hover, inspect mode, the overlay highlight,
  the freeze, focus and Tab, visibility. Every event is recorded in
  window.__probe.events as { type, phase, at }, where `phase` is whatever the
  test last set, so a test can tell which step an event belongs to.
  ?timer=1 runs a 10 ms interval (the timer page of ADR 0008); without it the
  page runs no script after load (the idle page).
-->
<div id="target"><span id="inner">target</span></div>
<input id="first" aria-label="first">
<button id="last" type="button">last</button>
<script>
  var probe = { phase: 'load', events: [], ticks: 0 }
  window.__probe = probe
  function record(type) { probe.events.push({ type: type, phase: probe.phase, at: Date.now() }) }
  probe.count = function (type, phase) {
    return probe.events.filter(function (e) { return e.type === type && (phase === undefined || e.phase === phase) }).length
  }
  var target = document.getElementById('target')
  ;['mouseover', 'mousemove', 'mousedown', 'click'].forEach(function (type) { target.addEventListener(type, function () { record(type) }) })
  ;['focus', 'blur'].forEach(function (type) {
    document.getElementById('first').addEventListener(type, function () { record(type + ':first') })
    document.getElementById('last').addEventListener(type, function () { record(type + ':last') })
  })
  window.addEventListener('blur', function () { record('window-blur') })
  window.addEventListener('focus', function () { record('window-focus') })
  document.addEventListener('visibilitychange', function () {
    record('visibility:' + document.visibilityState)
    if (document.visibilityState === 'visible') {
      // The first two frames after the page is shown again (still-image drop delay, ADR 0011 decision 3).
      requestAnimationFrame(function () { record('frame-after-visible'); requestAnimationFrame(function () { record('frame-after-visible') }) })
    }
  })
  // Resolves after `n` animation frames: a page that is not painting never resolves.
  probe.frames = function (n) {
    return new Promise(function (resolve) {
      var left = n
      function step() { left -= 1; if (left <= 0) resolve(document.visibilityState); else requestAnimationFrame(step) }
      requestAnimationFrame(step)
    })
  }
  // Opt in: a log of animation-frame times (Date.now()), so a test can read the frames after a moment it names.
  probe.frameLog = []
  probe.logFrames = function () {
    function tick() { probe.frameLog.push(Date.now()); if (probe.frameLog.length > 600) probe.frameLog.shift(); requestAnimationFrame(tick) }
    requestAnimationFrame(tick)
    return 0
  }
  if (new URLSearchParams(location.search).get('timer') === '1') setInterval(function () { probe.ticks += 1 }, 10)
</script>
</body>
</html>
