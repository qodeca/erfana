name: Build Linux (reusable)

# Reusable workflow callable from release.yml. No external signing deps —
# Linux artifacts are integrity-verified via the aggregate SHA256SUMS
# minisign signature produced in finalize (not per-file .deb/.rpm
# signing — documented aggregate-sums model).

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name (e.g. v0.9.5)
        required: true
        type: string
      is-dry-run:
        description: Skip gh release upload
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork exfiltration guard — every job carries this, not just signing legs.
    if: github.repository == 'qodeca/erfana'
    # EP_GH_IGNORE_TIME tells electron-builder not to use file timestamps
    # as a cache key; keeps provenance deterministic across runner reuse.
    env:
      EP_GH_IGNORE_TIME: "true"
    steps:
      # actions/checkout v4.2.2 — MUST run before the local composite action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node + install
        uses: ./.github/actions/setup-node-with-retry
        with:
          run-postinstall: "true"

      - name: Bundle sources (electron-vite)
        # electron-builder packages prebuilt main/preload/renderer bundles
        # from out/; it does NOT invoke electron-vite itself. Must run
        # before electron-builder or packaging fails the sanity check
        # for out/main/index.js.
        run: npx electron-vite build

      - name: Build Linux targets
        run: |
          set -euo pipefail
          # --publish never: never let electron-builder touch the draft.
          # The orchestrator owns release lifecycle.
          npx electron-builder --linux --publish never

      - name: Resolve artifact dir
        id: art
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DIR="release/${VERSION}"
          if [ ! -d "$DIR" ]; then
            echo "::error::Missing artifact dir $DIR"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          # Fail loudly if electron-builder leaked an auto-updater file.
          # compgen -G has cleaner semantics than `ls` for "does any file
          # match this glob?"; `ls` also exits non-zero on no-match which
          # would need extra handling.
          if compgen -G "$DIR/latest*.yml" >/dev/null; then
            echo "::error::Auto-updater file leaked into $DIR"
            compgen -G "$DIR/latest*.yml" || true
            exit 1
          fi
          echo "Built artifacts:"
          ls -la "$DIR"

      - name: Verify SHA256 for each artifact
        # Pre-attestation local integrity check. Proves the file we attest
        # has the same bytes the checksum step will eventually publish.
        run: |
          set -euo pipefail
          cd "${{ steps.art.outputs.dir }}"
          for f in *.AppImage *.deb *.rpm; do
            [ -e "$f" ] || continue
            sha256sum "$f"
          done

      # actions/attest-build-provenance v2.2.3
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: |
            ${{ steps.art.outputs.dir }}/*.AppImage
            ${{ steps.art.outputs.dir }}/*.deb
            ${{ steps.art.outputs.dir }}/*.rpm

      - name: Upload to draft release
        if: ${{ !inputs.is-dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ART_DIR: ${{ steps.art.outputs.dir }}
        run: |
          set -euo pipefail
          # --clobber for idempotency on re-run. The prepare job creates
          # the draft; we only upload into it.
          gh release upload "$TAG" \
            "$ART_DIR"/*.AppImage \
            "$ART_DIR"/*.deb \
            "$ART_DIR"/*.rpm \
            --clobber

      - name: Upload workflow-run artifacts (dry-run)
        if: ${{ inputs.is-dry-run }}
        # actions/upload-artifact v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: linux-dry-run
          path: ${{ steps.art.outputs.dir }}
          retention-days: 7
