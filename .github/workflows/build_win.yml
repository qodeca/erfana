name: Build Windows (reusable)

# Reusable workflow callable from release.yml. Signs with Azure Artifact
# Signing (formerly Azure Trusted Signing) via OIDC federation (no
# long-lived client secret). Verifies Authenticode signature on both
# NSIS installer and portable .exe.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name (e.g. v0.9.5)
        required: true
        type: string
      is-dry-run:
        description: Skip gh release upload
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # id-token: write still needed for azure/login OIDC federation.
  id-token: write

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.repository == 'qodeca/erfana'
    environment: production-signing
    env:
      EP_GH_IGNORE_TIME: "true"
      # electron-builder.yml references these env vars inside
      # win.azureSignOptions via ${env.VAR} interpolation.
      AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      # electron-builder 26's WindowsSignAzureManager uses @azure/identity's
      # EnvironmentCredential, which requires these two as shell env vars
      # at runtime. azure/login@v2 does NOT reliably export them to
      # downstream steps, so we set them here explicitly (the values are
      # the same secrets azure/login uses to perform OIDC auth).
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      # actions/checkout v4.2.2 — MUST run before the local composite action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node + install
        uses: ./.github/actions/setup-node-with-retry
        with:
          run-postinstall: "true"

      # azure/login v2.2.0
      # OIDC federated credential — no long-lived client secret is stored.
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Write OIDC token file for electron-builder EnvironmentCredential
        # electron-builder 26's WindowsSignAzureManager uses @azure/identity's
        # EnvironmentCredential, which needs:
        #   - AZURE_TENANT_ID
        #   - AZURE_CLIENT_ID
        #   - ONE OF: AZURE_CLIENT_SECRET / AZURE_CLIENT_CERTIFICATE_PATH
        #             / AZURE_FEDERATED_TOKEN_FILE
        # We use the federated-token-file path (OIDC). azure/login@v2 does
        # NOT expose the token as a file for downstream steps, so we fetch
        # it ourselves via GitHub's Actions OIDC endpoint.
        #
        # Using bash + node instead of pwsh — more predictable GITHUB_ENV
        # append semantics on windows-latest (pwsh Out-File can introduce
        # UTF-8 BOM or encoding surprises).
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_PATH="${RUNNER_TEMP}/azure_oidc_token"
          RESPONSE_PATH="${RUNNER_TEMP}/azure_oidc_response.json"
          curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            -o "$RESPONSE_PATH"
          # Use node to extract .value — guaranteed available after setup-node.
          node -e "const j=require(process.env.RESPONSE_PATH);require('fs').writeFileSync(process.env.TOKEN_PATH, j.value)" \
            RESPONSE_PATH="$RESPONSE_PATH" TOKEN_PATH="$TOKEN_PATH"
          rm -f "$RESPONSE_PATH"
          # Basic sanity — JWT header starts with eyJ
          HEAD=$(head -c 3 "$TOKEN_PATH")
          if [ "$HEAD" != "eyJ" ]; then
            echo "::error::OIDC token file does not start with JWT header 'eyJ'"
            exit 1
          fi
          SIZE=$(wc -c < "$TOKEN_PATH")
          echo "Token file: $TOKEN_PATH (${SIZE} bytes, starts 'eyJ')"
          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_PATH" >> "$GITHUB_ENV"
          echo "AZURE_AUTHORITY_HOST=https://login.microsoftonline.com" >> "$GITHUB_ENV"

      - name: Verify AZURE_* env reaches the build step
        # Quick diagnostic — if this shows blanks, next step will also
        # fail the same way. Helps disambiguate env-propagation vs
        # credential-validity bugs on future debug runs.
        shell: bash
        run: |
          echo "AZURE_TENANT_ID=${AZURE_TENANT_ID:+SET}"
          echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID:+SET}"
          echo "AZURE_FEDERATED_TOKEN_FILE=${AZURE_FEDERATED_TOKEN_FILE:-UNSET}"
          echo "AZURE_AUTHORITY_HOST=${AZURE_AUTHORITY_HOST:-UNSET}"
          if [ -n "${AZURE_FEDERATED_TOKEN_FILE:-}" ] && [ -s "$AZURE_FEDERATED_TOKEN_FILE" ]; then
            echo "Token file present + non-empty"
          else
            echo "::warning::Token file missing or empty"
          fi

      - name: Bundle sources (electron-vite)
        # electron-builder packages prebuilt bundles from out/; it does NOT
        # invoke electron-vite itself. Must run before electron-builder or
        # packaging fails the sanity check for out/main/index.js.
        shell: bash
        run: npx electron-vite build

      - name: Build + sign (electron-builder / Azure Artifact Signing)
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --win --publish never

      - name: Resolve artifact dir
        id: art
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DIR="release/${VERSION}"
          [ -d "$DIR" ] || { echo "::error::Missing $DIR"; exit 1; }
          # compgen -G has cleaner semantics than `ls` for existence testing.
          if compgen -G "$DIR/latest*.yml" >/dev/null; then
            echo "::error::Auto-updater file leaked into $DIR"
            compgen -G "$DIR/latest*.yml" || true
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Verify Authenticode signatures (signtool)
        shell: pwsh
        # signtool ships with Windows SDK; resolve the latest SDK bin dir
        # to avoid hardcoding a versioned path.
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkBin = Get-ChildItem $sdkRoot -Directory `
            | Where-Object { $_.Name -match '^10\.' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            throw "signtool.exe not found under $sdkRoot"
          }
          $dir = "${{ steps.art.outputs.dir }}"
          # Both NSIS installer and portable .exe must verify independently.
          foreach ($pattern in @('*-setup.exe', '*-portable.exe')) {
            Get-ChildItem -Path $dir -Filter $pattern | ForEach-Object {
              Write-Host "signtool verifying: $($_.FullName)"
              & $signtool verify /pa /all /tw $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool verify failed for $($_.FullName)"
              }
            }
          }

      - name: Upload to draft release
        if: ${{ !inputs.is-dry-run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ART_DIR: ${{ steps.art.outputs.dir }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$ART_DIR"/*-setup.exe \
            "$ART_DIR"/*-portable.exe \
            --clobber

      - name: Upload workflow-run artifacts (dry-run)
        if: ${{ inputs.is-dry-run }}
        # actions/upload-artifact v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: win-dry-run
          path: ${{ steps.art.outputs.dir }}
          retention-days: 7
