name: E2E Tests

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-vite build

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      # Visual tests require platform-specific baselines in e2e/screenshots/.
      # macOS (darwin) baselines are committed; tests skip on other platforms.
      # If ALL visual tests skip, the run still passes – generate baselines
      # for the new platform before relying on CI visual regression.

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 30 || 14 }}

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/develop' && 30 || 14 }}
