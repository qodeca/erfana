name: Browser Isolation

# The built-in browser's hostile-page suite (spec 025, 025-NFR-001,
# 025-AC-046, 025-AC-068): pages that try to reach Erfana – its IPC,
# window.electron, custom schemes, the renderer entry and the dev-server
# origin, popups, another local folder's server – must get nothing. The suite
# is the `browser-isolation` Playwright project (playwright.config.ts), run
# headless on Linux under xvfb in the same Docker image as
# `npm run test:e2e:linux` (scripts/e2e-linux.sh, e2e/docker/Dockerfile).
#
# Advisory until the owner makes `Browser isolation` a required check in
# GitHub after the spec 025 merge (decision Q9, 2026-11-03; solution design
# § 12). The triggers are already the ones a required check needs:
#
# - No paths filter on purpose (design § 12): a change anywhere can open a
#   way out of the page, and a required check that skips never reports.
# - push ignores gh-readonly-queue/** and keeps tags, and merge_group runs on
#   the develop merge queue – the same pattern as checks.yml and
#   secret-scan.yml (#173, docs/ci.md § Merge queue). Without merge_group a
#   required `Browser isolation` would leave every queued PR waiting.
# - pull_request covers PRs from forks, which have no push run here.
on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    tags:
      - '**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

# Cancel an in-flight run on the same ref when a new push lands.
concurrency:
  group: browser-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-isolation:
    name: Browser isolation
    runs-on: ubuntu-latest
    # Design target: under 10 minutes. The cap leaves room for the image
    # build and `npm ci` inside the container on a cold runner.
    timeout-minutes: 20
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1 — pinned to match the other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the hostile-page suite in Docker under xvfb
        # CI=1 as in e2e-linux.yml; the browser-isolation project pins its own
        # retries to 0, so a hostile page that gets through once fails the job.
        env:
          CI: '1'
        run: bash scripts/e2e-linux.sh --project=browser-isolation
      - name: Upload report and test results
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-isolation-report
          path: .local/e2e-linux/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
