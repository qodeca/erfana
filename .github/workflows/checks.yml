name: Quality Checks

# Fast, platform-independent quality gates that run on every push to every
# branch. Complements e2e.yml (slow, macOS-only, develop/main/PR) by giving
# feature branches fast-feedback CI on lint / typecheck / unit tests / build
# plus supply-chain and release-readiness guards.
#
# Runner: ubuntu-latest (~10x cheaper than macos-latest; none of these
# checks need macOS). Node version matches e2e.yml (24). npm download cache
# enabled via setup-node-with-retry.

on:
  push:

permissions:
  contents: read

# Cancel any in-flight run on the same ref when a new push lands.
# Saves runner minutes on rapid pushes / force-pushes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
      - name: Lint
        run: npm run lint
      # Steps, not a separate job: branch protection matches the JOB name
      # ("Lint"), so a new job called "Lint CSS" would be advisory only and
      # nothing would be enforced. Adding steps here needs no protection change.
      - name: Lint CSS
        run: npm run lint:css
      # Everything under design/ is committed, generated files included, so the
      # folder renders on a fresh clone. This is what stops a stale token copy or
      # a stale index being trusted by a reader.
      - name: Design system is in sync
        run: npm run design -- --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
        with:
          # ConverterRegistry.test.ts + other electron-aware tests import
          # the electron binary; `--ignore-scripts` skipped electron's
          # postinstall download. Rebuild the allowlisted natives so the
          # binary + node-pty are present for vitest.
          run-postinstall: "true"

      # Guard: chokidar pinned to exact 3.6.0.
      # v4 removed disableGlobbing — DirectoryWatcherService /
      # FileWatcherService / GitWatcherService all rely on it (FD-exhaustion
      # fix shipped in merge 1139bf2). A regenerated lockfile, an
      # `npm install chokidar` bump, or a transitive declaring ^4 would all
      # have failed today's clean-checkout typecheck silently in the past;
      # this guard makes it loud. Runs before tests so we know what's being
      # tested.
      - name: Guard - chokidar v3 pinned
        run: |
          set -euo pipefail
          ACTUAL=$(node -p "require('chokidar/package.json').version")
          if [ "$ACTUAL" != "3.6.0" ]; then
            echo "::error::chokidar version drift: expected 3.6.0, got $ACTUAL — see package.json overrides and #1416"
            exit 1
          fi
          echo "chokidar pinned at $ACTUAL"

      - name: Unit tests
        # Deprecation tripwire: captures vitest output and fails if any
        # deprecation warning that ISN'T already on the known-and-tracked
        # whitelist appears. The known `workspace` / `defineWorkspace`
        # deprecation is on the whitelist because Phase H of the test-
        # infrastructure plan migrates it (root vitest.config.ts with
        # `projects: [...]`). Any other deprecation (e.g. a new vitest 3.x
        # warning, a Node.js DEPnnn) fires this step.
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vitest.log"
          set +e
          npm run test:ci 2>&1 | tee "$OUT"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          # Match deprecation/DEP-warning lines NOT covered by the whitelist.
          # Whitelist (known, tracked):
          #   - `workspace` / `defineWorkspace` — vitest 3.2 → 4 migration (Phase H)
          UNTRACKED=$(grep -iE 'deprecated|DEP[0-9]+' "$OUT" | \
            grep -viE 'workspace|defineWorkspace' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked deprecation warning(s) detected:"
            echo "$UNTRACKED"
            exit 1
          fi
          exit "$TEST_EXIT"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    # Enforces the per-file coverage FLOORS declared in vitest.main.ts under
    # test.coverage.thresholds: scripts/fuses.js (the issue #43/#55 packaging-
    # integrity guards + Electron fuses) and the whisper trust-chain modules
    # (verifyManifest / secureDownloader / zipArchive / tarArchive) + the #41
    # model-id registry. The required `test` job runs `test:ci` WITHOUT coverage,
    # so these floors fire ONLY here — this job is what makes them a gate rather
    # than a local-only `npm run test:cov` nicety (issue #55, F4 residual).
    #
    # Scoped to the main project (`--project main`) on purpose: only the main
    # project's tests load scripts/fuses.js (via scripts/fuses.test.mjs), so the
    # v8 report carries exactly ONE fuses.js row at its real ~88% coverage. A
    # full-workspace run pulls renderer/preload tests in too and — with an
    # untested include or `all: true` — can emit a second 0%-baseline fuses.js
    # row; `all: false` in vitest.main.ts already collapses that, and `--project
    # main` keeps the instrumented set (and therefore the threshold match)
    # unambiguous and deterministic. Do NOT drop `--project main`.
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
        with:
          # scripts/fuses.test.mjs + the other main-process tests import the
          # electron binary and node-pty native bindings; run the allowlisted
          # postinstall so they are present for the coverage run.
          run-postinstall: "true"
      - name: Main-project coverage (enforces the scripts/fuses.js + whisper floors)
        # Fails the job when any per-file floor in vitest.main.ts is breached
        # (vitest exits non-zero on a threshold miss). --coverage activates the
        # thresholds; --config supplies them; --project main scopes the run.
        run: npx vitest --run --config vitest.main.ts --project main --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
        with:
          # electron-vite build imports native modules at config resolution
          # time; run the allowlisted postinstall to avoid import errors.
          run-postinstall: "true"
      - name: Build
        run: npx electron-vite build

  license:
    name: License compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
      - name: SPDX headers present on all source files
        run: npm run check:headers
      - name: REUSE compliance
        # charset-normalizer extra avoids reuse's "no encoding module" error on
        # minimal runners. pipx is preinstalled on ubuntu-latest.
        run: pipx run --spec "reuse[charset-normalizer]" reuse lint

  windows-checks:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    # Advisory Windows gate (typecheck + main-process tests only). Excluded
    # from branch-protection required checks until proven stable, mirroring
    # how e2e is kept out of the required set. The concurrency block above
    # already cancels in-flight runs on the same ref.
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
        with:
          # test:main imports the electron binary + node-pty native bindings;
          # run the allowlisted postinstall so they're present for vitest.
          # node-pty rebuild on hardened Windows 11 is fixed (commit 51e5946).
          run-postinstall: "true"
      - name: Typecheck
        # windows-latest defaults to PowerShell; force bash for parity with
        # the local composite action and the other jobs.
        shell: bash
        run: npm run typecheck
      - name: Main-process tests
        shell: bash
        run: npm run test:main

  audit-signatures:
    name: npm audit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # actions/checkout v6.0.3 — MUST run before the local composite action
      # below so the action.yml file can be loaded from the workspace.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node-with-retry
      - name: Verify npm registry signatures
        # Asserts every package in package-lock.json is signed by npm's
        # registry key. Detects lockfile tampering / sidecar attacks.
        # Plain `npm audit` is not required here because vulnerability
        # fixes flow through Dependabot PRs (also gated by this workflow).
        run: npm audit signatures

      - name: Record package-lock.json digest
        # release.yml prepare downloads this artifact from the matching
        # green checks.yml run and asserts byte-equality with the
        # package-lock.json present at tag time. Defense against lockfile
        # substitution between "checks green" and "tag pushed".
        run: |
          set -euo pipefail
          sha256sum package-lock.json | cut -d' ' -f1 > package-lock.sha256
          echo "package-lock.json digest: $(cat package-lock.sha256)"

      - name: Upload package-lock digest artifact
        # actions/upload-artifact v7.0.1 — keep SHA aligned with build_*.yml
        # (Dependabot will keep these in lockstep once #B2 lands).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-lock-digest
          path: package-lock.sha256
          retention-days: 90

  release-guards:
    name: Release readiness guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.repository == 'qodeca/erfana' || github.event_name == 'pull_request'
    steps:
      # fetch-depth: 0 so the electron-builder.yml packaging guard can compare
      # the extraResources: block against the push/PR base commit (issue #55).
      # The default depth-1 checkout has no base to diff against, which would
      # force that guard into its fail-safe warn-always path.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # Guard 1: no pull_request_target triggers anywhere.
      # Fork exfiltration vector: pull_request_target runs with base-repo
      # write permissions on code from an untrusted PR.
      #
      # Exclude checks.yml from the scan — this file contains the literal
      # string `pull_request_target:` inside the grep pattern below, which
      # would otherwise cause a self-referential match.
      - name: Guard - no pull_request_target
        run: |
          set -euo pipefail
          if grep -Rn --include='*.yml' --include='*.yaml' \
              --exclude=checks.yml \
              'pull_request_target:' .github/workflows/; then
            echo "::error::pull_request_target found — fork exfiltration vector"
            exit 1
          fi

      # Guard 2: forbidden entitlements must not appear in any plist.
      # cs.disable-library-validation weakens hardened runtime by allowing
      # unsigned libraries to load. cs.allow-dyld-environment-variables lets
      # DYLD_* env vars inject code into the app at launch.
      #
      # Match only the XML <key>...</key> form so our own plist comments
      # documenting the rule don't trigger a self-referential match.
      - name: Guard - no forbidden entitlements
        run: |
          set -euo pipefail
          if grep -Rn --include='*.plist' \
              -E '<key>com\.apple\.security\.cs\.(disable-library-validation|allow-dyld-environment-variables)</key>' \
              build/; then
            echo "::error::forbidden entitlement found"
            exit 1
          fi

      # Guard 3: legacy and forbidden signing credentials must not appear
      # in any workflow.
      # - `altool`: the deprecated Apple notarization CLI (replaced by notarytool).
      # - `AZ_CLIENT_SECRET`: the pre-Azure-CLI-2.x env var name used with
      #   cascading auth in older Azure pipelines. We specifically reject
      #   this legacy form; the modern `AZURE_CLIENT_SECRET` (used by
      #   @azure/identity) is PERMITTED as a fallback credential path,
      #   though this project uses AZURE_CLIENT_CERTIFICATE_* since
      #   electron-builder 26's WindowsSignAzureManager rejects OIDC
      #   federated tokens (no AZURE_FEDERATED_TOKEN_FILE support upstream).
      # Note: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD are PERMITTED. notarytool
      # accepts both the API-key and user-auth modes; only the altool CLI
      # binding was deprecated. This project uses the user-auth mode for
      # simplicity since the app-specific password is already provisioned.
      # Exclude checks.yml (this file) to avoid matching the literal tokens
      # inside the grep pattern itself. We keep the scan scoped to
      # .github/workflows/ so allow-lists in other docs/scripts aren't
      # reported as violations.
      - name: Guard - no legacy/forbidden credentials
        run: |
          set -euo pipefail
          if grep -REn --include='*.yml' --include='*.yaml' \
              --exclude=checks.yml \
              '\bAZ_CLIENT_SECRET\b|\baltool\b' \
              .github/workflows/; then
            echo "::error::forbidden credential reference in workflow"
            exit 1
          fi

      # Guard 4 (advisory, non-failing): warn if AZURE_CLIENT_SECRET appears
      # in any workflow. The modern AZURE_CLIENT_SECRET is permitted as a
      # fallback @azure/identity auth path, but this project uses
      # AZURE_CLIENT_CERTIFICATE_* exclusively. A future contributor adding
      # AZURE_CLIENT_SECRET would silently downgrade the auth path; surface
      # it for review without failing the run.
      - name: Guard - warn on AZURE_CLIENT_SECRET (advisory)
        run: |
          set -euo pipefail
          if grep -REn --include='*.yml' --include='*.yaml' \
              --exclude=checks.yml \
              '\bAZURE_CLIENT_SECRET\b' \
              .github/workflows/; then
            echo "::warning::AZURE_CLIENT_SECRET found in workflow — this project uses certificate auth (AZURE_CLIENT_CERTIFICATE_*); confirm this is intentional"
          fi

      # Guard 5: minisign release-pubkey drift detector.
      # The release-signing minisign pubkeys (PRIMARY + ROTATION, dual-key
      # per ADR-0003) MUST be byte-equal across three published locations:
      #   - docs/release-pubkey.txt  (canonical, consumed by skill Phase 4)
      #   - docs/security.md         (between minisign-pubkey-{primary,rotation}-{begin,end} fences)
      #   - README.md                (mirrored in verification recipe)
      # If they drift, end-user verification will fail in confusing ways.
      # This guard extracts the keys from each source and asserts equality.
      - name: Guard - release pubkey drift across docs
        run: |
          set -euo pipefail
          # Sorted set of all RW... lines in the canonical file.
          CANONICAL=$(grep -E '^RW[A-Za-z0-9+/=]+$' docs/release-pubkey.txt | sort -u)
          # Every base64 line between any minisign-pubkey-*-begin / -end pair.
          SECURITY_MD=$(awk '
            /^<!-- minisign-pubkey-(primary|rotation)-begin -->$/ { in_block=1; next }
            /^<!-- minisign-pubkey-(primary|rotation)-end -->$/   { in_block=0; next }
            in_block && /^RW[A-Za-z0-9+\/=]+$/                    { print }
          ' docs/security.md | sort -u)
          # README mirror — match RW... lines on their own (e.g. inside `text` fences).
          README=$(grep -E '^RW[A-Za-z0-9+/=]+$' README.md | sort -u || true)
          if [ "$CANONICAL" != "$SECURITY_MD" ]; then
            echo "::error::release pubkey drift between docs/release-pubkey.txt and docs/security.md"
            diff <(printf '%s\n' "$CANONICAL") <(printf '%s\n' "$SECURITY_MD") || true
            exit 1
          fi
          if [ -n "$README" ] && [ "$CANONICAL" != "$README" ]; then
            echo "::error::release pubkey drift between docs/release-pubkey.txt and README.md"
            diff <(printf '%s\n' "$CANONICAL") <(printf '%s\n' "$README") || true
            exit 1
          fi
          echo "release pubkeys consistent across docs/release-pubkey.txt, docs/security.md$( [ -n "$README" ] && echo ', README.md')"

      # Guard 6: electron-builder packaging allowlist (issue #43).
      # app-builder-lib's FileMatcher.containsOnlyIgnore() treats a `files:`
      # list of only '!' patterns as "no includes given" and splices an implicit
      # '**/*' at index 0, packaging the ENTIRE repository root into
      # Contents/Resources/app/ - untracked local-only directories included, and
      # uncompressed under `asar: false`. One positive pattern restores allowlist
      # semantics; an all-matching positive re-creates the bug explicitly.
      # This guard also asserts the afterPack/afterSign wiring, because deleting
      # that one line silently disables every packaging guard AND all three
      # Electron security fuses with a green build.
      # The packed-tree counterpart is assertPackagedAppContents() in
      # scripts/fuses.js, which runs during afterPack, before signing.
      # Pure awk/grep: this job is checkout-only, so there is no `npm ci` and
      # therefore no js-yaml (node itself is preinstalled, but a parser is not).
      - name: Guard - electron-builder packaging allowlist
        env:
          # Resolved here, not interpolated into the script body, so no github.*
          # value is ever spliced into shell source. Empty on non-push/PR events;
          # the guard treats empty as "no base" and falls back to warning.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # $1 is never passed by the `run:` step (it always defaults); it exists
          # so the manual negative tests can point the guard at a mutated copy:
          # `bash guard.sh /tmp/broken.yml`.
          EB_CONFIG="${1:-electron-builder.yml}"

          # 1. Hook wiring must still be present. Optional quotes: 'x' and x are
          #    the same YAML, and both work in electron-builder.
          grep -qE "^afterPack:[[:space:]]*['\"]?\./scripts/fuses\.js['\"]?[[:space:]]*$" "$EB_CONFIG" || {
            echo "::error::$EB_CONFIG is missing 'afterPack: ./scripts/fuses.js' - every packaging guard and Electron fuse silently stops running (issue #43)"
            exit 1
          }
          grep -qE "^afterSign:[[:space:]]*['\"]?\./scripts/resign\.js['\"]?[[:space:]]*$" "$EB_CONFIG" || {
            echo "::error::$EB_CONFIG is missing 'afterSign: ./scripts/resign.js' - the macOS re-signing step stops running"
            exit 1
          }

          # 1b. A platform block (mac:/win:) may carry its own indented files:,
          #     which app-builder-lib concatenates into the SAME matcher. The
          #     required Unit-tests job already verifies platform files: (the
          #     electron-builder.yml binding test reads config.mac?.files), so this
          #     shell scanner - which cannot parse the nested block - only warns.
          if grep -qE '^[[:space:]]+files:' "$EB_CONFIG"; then
            echo "::warning::$EB_CONFIG has a platform-specific files: block. This shell guard cannot verify it; the Unit-tests job's electron-builder.yml binding test is the hard gate for it (issue #43)."
          fi

          # 2. Extract the files: block. A list item may legally sit at column 0,
          #    so only a non-list, non-comment line at column 0 ends the block;
          #    an inline comment on the key is tolerated.
          BLOCK=$(awk '
            /^files:[[:space:]]*(#.*)?$/  { in_block=1; next }
            in_block && /^[^[:space:]#-]/ { in_block=0 }
            in_block                      { print }
          ' "$EB_CONFIG")
          if [ -z "$BLOCK" ]; then
            echo "::error::$EB_CONFIG has no block-sequence files: list - this guard only understands the block form ('files:' on its own line, then '- pattern' items). The Unit-tests job's YAML-parsed binding test covers other shapes (issue #43)."
            exit 1
          fi

          # 3. Count only this block's own top-level items, so a nested filter:
          #    list inside a FileSet entry is not miscounted as an include.
          # `|| true` on both: under `set -e` with pipefail a non-matching grep
          # would abort the step before the diagnostics below could print.
          # The trailing `sed 's/[[:space:]]+#.*$//'` strips an inline comment
          # BEFORE the quote strip, so `- '*'  # everything` cannot smuggle a
          # wildcard past check 5 as the literal item `*"  # everything`.
          INDENT=$(printf '%s\n' "$BLOCK" | grep -vE '^[[:space:]]*#' \
            | grep -m1 -E '^[[:space:]]*-[[:space:]]+' | sed -E 's/-.*//' || true)
          ITEMS=$(printf '%s\n' "$BLOCK" | grep -E "^${INDENT}-[[:space:]]+" \
            | sed -E "s/^${INDENT}-[[:space:]]+//" \
            | sed -E "s/[[:space:]]+#.*\$//" \
            | sed -E "s/^['\"]//; s/['\"][[:space:]]*\$//" || true)
          if [ -z "$ITEMS" ]; then
            echo "::error::$EB_CONFIG files: block contains no list items"
            exit 1
          fi

          # 3b. A list item that opens a mapping (`- from: x`) is a FileSet, not
          #     a pattern. Counting it as a positive would be a false pass, and
          #     this guard cannot reason about where a FileSet lands, so it fails
          #     closed. Deliberately STRICTER than scripts/fuses.js, which must
          #     accept a non-remapping FileSet: electron-builder normalises a
          #     plain string list into `[{filter: [...]}]` before handing it to
          #     the afterPack hook, so rejecting that shape there would throw on
          #     every real build. A literal FileSet in the YAML is still refused.
          if printf '%s\n' "$ITEMS" | grep -qE '^[A-Za-z_][A-Za-z0-9_.-]*:([[:space:]]|$)'; then
            echo "::error::$EB_CONFIG files: contains a FileSet entry, which this guard cannot verify. Update the guard in .github/workflows/checks.yml and deriveAllowedAppEntries in scripts/fuses.js together (issue #43)."
            exit 1
          fi

          # 4. At least one positive pattern, or app-builder-lib splices '**/*'.
          #    grep -c prints 0 and exits 1, so || true keeps the 0 reaching the test.
          POSITIVE=$(printf '%s\n' "$ITEMS" | grep -cv '^!' || true)
          if [ "$POSITIVE" -lt 1 ]; then
            echo "::error::$EB_CONFIG files: contains only negated patterns - app-builder-lib splices an implicit '**/*' and packages the entire repository root (issue #43). Add a positive pattern, e.g. 'out/**'."
            exit 1
          fi

          # 5. An all-matching positive reproduces the same bug explicitly.
          #    Mirrors deriveAllowedAppEntries in scripts/fuses.js: reject when
          #    the pattern's FIRST path segment is a wildcard, rather than
          #    enumerating spellings ('**/**' and '*/**' sweep the root too).
          while IFS= read -r item; do
            [ -n "$item" ] || continue
            case "$item" in '!'*) continue ;; esac
            # electron-builder strips a leading './' before matching, so strip it
            # here too - otherwise './**' yields first='.' and passes while
            # deriveAllowedAppEntries in scripts/fuses.js rejects it.
            item="${item#./}"
            # A '..' segment escapes the project root (app-builder-lib normalises
            # it, so `out/../**` becomes `**`); the shell scanner cannot normalise,
            # so reject any traversal outright to stay in step with fuses.js.
            case "$item" in
              ''|.|..|../*|*/../*|*/..)
                echo "::error::$EB_CONFIG files: positive pattern '$item' contains a '..' path segment that escapes the project root (issue #43)."
                exit 1
                ;;
            esac
            first="${item%%/*}"
            if [ "$first" = '*' ] || [ "$first" = '**' ]; then
              echo "::error::$EB_CONFIG files: positive pattern '$item' begins with a wildcard at the repository root - this packages the entire repository root exactly as the implicit '**/*' did (issue #43)."
              exit 1
            fi
          done <<ITEMS_EOF
          $ITEMS
          ITEMS_EOF

          # 6. Extra-content presence guard (issue #55). COARSE by design (F4):
          #    this reasons about YAML text only, so it does NOT pair from/to or
          #    judge FileSet dest validity - that authoritative shape check lives
          #    in scripts/fuses.test.mjs ("agrees with the repository
          #    electron-builder.yml as shipped"), which YAML-parses the real
          #    config and runs in the required Unit-tests job. Coupled to the
          #    ALLOWED_EXTRA_RESOURCES_DESTS / ALLOWED_EXTRA_FILES_DESTS constants
          #    in scripts/fuses.js and the L1-L2 guards there.
          #
          # 6a. extraFiles: is fail-closed - ALLOWED_EXTRA_FILES_DESTS is empty,
          #     so ANY extraFiles: key is a hard error, whether at column 0, OR
          #     indented under a mac:/win: block (the platform-scoped edit path,
          #     F1), OR inline in a flow mapping (`mac: { extraFiles: [...] }`,
          #     F9). The runtime L1 guard folds platformSpecificBuildOptions, so
          #     this static check mirrors it by matching every one of those
          #     spellings: the block form (start-of-line, any indent) and the
          #     flow form (the key preceded by `{` or `,`).
          if grep -qE '^[[:space:]]*extraFiles[[:space:]]*:' "$EB_CONFIG" \
            || grep -qE '[{,][[:space:]]*extraFiles[[:space:]]*:' "$EB_CONFIG"; then
            echo "::error::$EB_CONFIG declares extraFiles:, but nothing is permitted at that destination (ALLOWED_EXTRA_FILES_DESTS in scripts/fuses.js is empty, fail-closed). Remove it, or update the allowlist + L1 guard together (issue #55)."
            exit 1
          fi

          # 6b. extraResources: is permitted but coupled. Warn when it is EDITED,
          #     so the change is a visible prompt to re-check
          #     ALLOWED_EXTRA_RESOURCES_DESTS and the binding test; the binding
          #     test is the hard gate for the from/to shape (F4).
          #
          #     Edit-triggered, not presence-triggered: extraResources: is
          #     permanently present (tessdata, LICENSE, THIRD-PARTY-LICENSES.md),
          #     so warning on presence fired on every push and could not signal an
          #     edit at all — the noise made it useless as a prompt. BASE_SHA is
          #     resolved by the caller (github.event.before / pull_request.base.sha).
          #
          #     Fail-safe: when the base is unknowable (new branch, force-push,
          #     shallow history) or $EB_CONFIG is not the tracked repo file (the
          #     manual negative tests point it at a mutated copy, §5.8), fall back
          #     to warning on presence rather than staying silent.
          #     Block extraction mirrors check 2's rule (a list item may sit at
          #     column 0, so only a non-list, non-comment line at an indent <= the
          #     key's ends the block) and covers the indented mac:/win: forms too.
          #     `tr -d '\r'` first: `git show` emits the blob (LF) while a checkout
          #     on a CRLF-normalising host has CRLF on disk, which would make every
          #     comparison unequal and warn on every run again.
          extract_extra_resources() {
            tr -d '\r' < "$1" | awk '
              /^[[:space:]]*extraResources:[[:space:]]*(#.*)?$/ {
                in_block = 1; key_indent = match($0, /[^[:space:]]/) - 1
                print; next
              }
              in_block && /^[[:space:]]*$/            { print; next }
              in_block && /^[[:space:]]*[-#]/         { print; next }
              in_block {
                if (match($0, /[^[:space:]]/) - 1 <= key_indent) { in_block = 0; next }
                print
              }
            '
          }

          if grep -qE '^[[:space:]]*extraResources:' "$EB_CONFIG"; then
            EB_WARN_REASON=""
            EB_NOW=$(extract_extra_resources "$EB_CONFIG")
            if [ "$EB_CONFIG" != "electron-builder.yml" ]; then
              EB_WARN_REASON="the config is not the tracked repo file, so no base to compare"
            elif [ -z "$EB_NOW" ]; then
              EB_WARN_REASON="its block could not be extracted for comparison"
            elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              EB_WARN_REASON="there is no comparable base commit (new branch or force-push)"
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              EB_WARN_REASON="base commit ${BASE_SHA} is not in this checkout"
            else
              git show "${BASE_SHA}:electron-builder.yml" > /tmp/eb-base.yml 2>/dev/null \
                || : > /tmp/eb-base.yml
              if [ "$EB_NOW" != "$(extract_extra_resources /tmp/eb-base.yml)" ]; then
                EB_WARN_REASON="its block changed since ${BASE_SHA}"
              fi
            fi

            if [ -n "$EB_WARN_REASON" ]; then
              echo "::warning::$EB_CONFIG declares extraResources: and $EB_WARN_REASON. Validate its from/to shape and dests in the Unit-tests job's binding test, and keep ALLOWED_EXTRA_RESOURCES_DESTS in scripts/fuses.js in step (issue #55)."
            else
              echo "extraResources: unchanged since ${BASE_SHA} - no re-check prompt needed"
            fi
          fi

          echo "electron-builder packaging allowlist OK ($POSITIVE positive pattern(s); afterPack/afterSign wiring present; no extraFiles:)"
