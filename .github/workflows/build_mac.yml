name: Build macOS (reusable)

# Reusable workflow callable from release.yml. Signs with Developer ID
# Application cert + notarizes via notarytool (user-auth mode: Apple ID +
# app-specific password + Team ID). `production-signing` environment gate
# lets repo admins require reviewer approval before credentials are touched.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name (e.g. v0.9.5)
        required: true
        type: string
      is-dry-run:
        description: Skip gh release upload
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS artifacts
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.repository == 'qodeca/erfana'
    environment: production-signing
    env:
      EP_GH_IGNORE_TIME: "true"
      # Notarization auth: Apple ID + app-specific password mode.
      # electron-builder 26 auto-routes this through notarytool when
      # APPLE_API_KEY* env vars are absent and APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
      # + APPLE_TEAM_ID are present. This is the supported user-auth path for
      # notarytool — only the older deprecated Apple notarization CLI was
      # the problem; notarytool itself accepts both auth modes.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # actions/checkout v4.2.2 — MUST run before the local composite action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node + install
        uses: ./.github/actions/setup-node-with-retry
        with:
          run-postinstall: "true"

      - name: Verify Rosetta 2 present (cross-arch native module rebuild)
        # macos-latest is arm64 since late 2024. Cross-arch rebuild of
        # native modules (node-pty etc.) during electron-builder --x64
        # needs Rosetta 2. Runner images may skip it; install explicitly.
        run: |
          set -euo pipefail
          if ! /usr/bin/pgrep -q oahd; then
            echo "Installing Rosetta 2…"
            sudo softwareupdate --install-rosetta --agree-to-license
          else
            echo "Rosetta 2 present."
          fi

      - name: Import Developer ID cert into ephemeral keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -eu
          # Ephemeral random password; never re-used, discarded at cleanup.
          KC_PW=$(openssl rand -base64 32)
          # Mask it in logs BEFORE writing to $GITHUB_ENV so any accidental
          # echo downstream gets scrubbed by the runner's log filter.
          echo "::add-mask::$KC_PW"
          echo "KC_PW=$KC_PW" >> "$GITHUB_ENV"
          KC_FILE="${RUNNER_TEMP}/build.keychain-db"
          echo "KC_FILE=$KC_FILE" >> "$GITHUB_ENV"
          # Explicit keychain hint for electron-builder; future runner changes
          # to the default keychain search order will not regress signing.
          echo "CSC_KEYCHAIN=$KC_FILE" >> "$GITHUB_ENV"

          security create-keychain -p "$KC_PW" "$KC_FILE"
          security list-keychains -d user -s "$KC_FILE" login.keychain-db
          security default-keychain -s "$KC_FILE"
          security unlock-keychain -p "$KC_PW" "$KC_FILE"
          security set-keychain-settings -lut 21600 "$KC_FILE"

          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          umask 077
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KC_FILE" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC_FILE"
          # Visible check (no secret output): identity present?
          security find-identity -v -p codesigning "$KC_FILE"

      - name: Bundle sources (electron-vite)
        # electron-builder packages prebuilt bundles from out/; it does NOT
        # invoke electron-vite itself. Must run before electron-builder or
        # packaging fails the sanity check for out/main/index.js.
        run: npx electron-vite build

      - name: Build + sign + notarize + staple (electron-builder)
        # electron-builder 26 auto-invokes notarytool when either the
        # APPLE_API_KEY triad or the APPLE_ID+APPLE_APP_SPECIFIC_PASSWORD+
        # APPLE_TEAM_ID triad is set (this project uses the latter).
        # Auto-staples on success. No custom notarize step needed.
        run: |
          set -euo pipefail
          npx electron-builder --mac --arm64 --x64 --publish never

      - name: Resolve artifact dir
        id: art
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DIR="release/${VERSION}"
          [ -d "$DIR" ] || { echo "::error::Missing $DIR"; exit 1; }
          # compgen -G has cleaner semantics than `ls` for existence testing.
          if compgen -G "$DIR/latest*.yml" >/dev/null; then
            echo "::error::Auto-updater file leaked into $DIR"
            compgen -G "$DIR/latest*.yml" || true
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Notarize + staple DMGs
        # electron-builder's `mac.notarize: true` notarizes the .app bundle
        # inside each DMG but NOT the DMG container itself. spctl assesses
        # the DMG as "no usable signature" until the DMG is separately
        # submitted to notarytool and stapled.
        #
        # notarytool --wait blocks until Apple's service returns Accepted
        # (or Rejected; exits non-zero in that case). Typical wait 1-5 min
        # per DMG, occasionally longer during Apple server load.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DIR="${{ steps.art.outputs.dir }}"
          for DMG in "$DIR"/*.dmg; do
            [ -e "$DMG" ] || continue
            echo "Notarizing: $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "Stapling: $DMG"
            xcrun stapler staple "$DMG"
          done

      - name: Verify signatures (codesign / stapler / spctl)
        run: |
          set -euo pipefail
          DIR="${{ steps.art.outputs.dir }}"
          # Every Erfana.app under the artifact dir must codesign-verify.
          while IFS= read -r -d '' APP; do
            echo "codesign verifying: $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          done < <(find "$DIR" -maxdepth 3 -name 'Erfana.app' -print0)

          # Every DMG must have a stapled notarization ticket AND pass
          # Gatekeeper. Order: stapler FIRST (offline check for the
          # ticket we just attached), then spctl (online/cached check).
          # Previously spctl was called first and rejected with "no
          # usable signature" because the DMG wasn't notarized yet.
          for DMG in "$DIR"/*.dmg; do
            [ -e "$DMG" ] || continue
            echo "stapler validating: $DMG"
            xcrun stapler validate "$DMG"
            echo "spctl assessing: $DMG"
            spctl -a -vvv -t install "$DMG"
          done

          # ZIPs carry the stapled ticket on the .app inside them.
          for Z in "$DIR"/*.zip; do
            [ -e "$Z" ] || continue
            echo "stapler validating: $Z"
            xcrun stapler validate "$Z"
          done

      - name: Upload to draft release
        if: ${{ !inputs.is-dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ART_DIR: ${{ steps.art.outputs.dir }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$ART_DIR"/*.dmg \
            "$ART_DIR"/*.zip \
            --clobber

      - name: Upload workflow-run artifacts (dry-run)
        if: ${{ inputs.is-dry-run }}
        # actions/upload-artifact v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: mac-dry-run
          path: ${{ steps.art.outputs.dir }}
          retention-days: 7

      - name: Tear down keychain
        # Runs on success, failure, and cancellation so private key
        # material never outlives the job.
        if: always()
        run: |
          set +e
          if [ -n "${KC_FILE:-}" ] && [ -e "$KC_FILE" ]; then
            security delete-keychain "$KC_FILE" || true
          fi
          security list-keychains -d user -s login.keychain-db || true
