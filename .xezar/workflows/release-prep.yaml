name: release-prep
description: Audit the requested release readiness and draft notes using the maintained publishing pipeline. Stops before merge and publish.
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Verify worktree isolation
    command: ".xezar/checks/worktree-preflight.sh"
    resultScope: routine
  - id: setup
    name: Prepare the worktree
    command: ".xezar/checks/worktree-setup.sh"
    resultScope: routine
  # The MCP mutation gate is no longer a step here either, for the reasons written out in the
  # `release` workflow beside the same removal. It runs nightly against `main` in
  # `.github/workflows/mutation.yml` (#377) instead. Unchanged, not softened: same scope, same
  # `thresholds.break` of 80.
  - id: prep
    name: Prepare the release
    prompt: "{{task}}"
    skill: xezar-release-prep
    timeout: 2h
  - id: readiness
    name: Confirm the phase record is complete and nothing blocks
    command: ".xezar/checks/worktree-preflight.sh --readiness"
    resultScope: stage
  - id: gates
    name: Quality gates
    command: ".xezar/checks/repo-gates.sh --fast --producer gates"
    resultScope: stage
    onFail:
      retry: prep
      max: 2
  - id: evidence
    name: Seal the gate evidence
    command: ".xezar/checks/worktree-preflight.sh --record-gate-evidence"
    resultScope: stage
  - id: handoff
    name: Draft PR into the base branch
    prompt: "Hand off the release preparation for: {{task}}"
    skill: xezar-handoff-draft-pr
