# Independent QA of a PR or its current head: exercise the change, verify the fix, post a
# verdict. Read-only like code-review: no setup, no gates, no commits. The verdict is posted with
# `gh` as a PR comment headed "## QA", never written into the tree. There is no readiness step, so
# `branch.owned-by-run` never applies to this role — reviewing another PR means checking its head
# out, which detaches HEAD, and a verdict-only role must never reach the check that refuses that
# (#356: independent QA always ended `failed` when it ran on `testing-and-verification` instead).
# Tool grant (#177): `emulate` is granted only to the qa and design-review roles. `evaluate_script`
# stays ungranted: a read-only step runs with `--setting-sources user`, so the origin guard
# (scripts/devtools-evaluate-guard.mjs) cannot be registered for it - see .xezar/LOCAL-PATCHES.md.
# bashAllowlist (#177): the read-only review set plus ONE run entry, the safe app start
# `node .xezar/checks/review-run-app.mjs <pr> <head-sha>` (xezar-qa.md: "check the PR's head out ... and run it"). It checks the PR head
# with gh, refuses the primary checkout and non-macOS hosts, and runs `npm ci` and the dev server
# under sandbox-exec in a private folder with no access to the owner's checkout or credentials.
# preflight runs strict (no --allow-root): the app start never moves this worktree off its branch.
name: qa
description: "Independent QA of a PR or its current head: exercise the change, verify the fix, post a ## QA verdict comment and apply the SDLC QA-gate labels. Read-only."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh"
    resultScope: routine
  - id: review
    name: QA
    prompt: "QA (see your skill for what to post and which labels to apply): {{task}} Report independence as confirmed, not confirmed or unknown, from the author the launch text names; never confirmed without that text. To run the PR's app, start `node .xezar/checks/review-run-app.mjs <pr-number> <head-sha>` in the background (it refuses anything but that PR's current head, in a task worktree, on macOS) and open http://localhost:5173/ with chrome-devtools; never check the head out into this worktree."
    skill: xezar-qa
    verdictRole: qa
    allowedTools: [Read, Grep, Glob, Bash, mcp__chrome-devtools__navigate_page, mcp__chrome-devtools__new_page, mcp__chrome-devtools__list_pages, mcp__chrome-devtools__select_page, mcp__chrome-devtools__close_page, mcp__chrome-devtools__take_snapshot, mcp__chrome-devtools__take_screenshot, mcp__chrome-devtools__list_console_messages, mcp__chrome-devtools__get_console_message, mcp__chrome-devtools__list_network_requests, mcp__chrome-devtools__get_network_request, mcp__chrome-devtools__click, mcp__chrome-devtools__fill, mcp__chrome-devtools__fill_form, mcp__chrome-devtools__hover, mcp__chrome-devtools__press_key, mcp__chrome-devtools__type_text, mcp__chrome-devtools__wait_for, mcp__chrome-devtools__handle_dialog, mcp__chrome-devtools__resize_page, mcp__chrome-devtools__get_css_styles, mcp__chrome-devtools__emulate]
    bashAllowlist: ["gh pr view", "gh pr diff", "gh pr checks", "gh pr list", "gh issue view", "gh issue list", "gh label list", "gh repo view", "jq -n", "bash .xezar/checks/git-read.sh", "bash .xezar/checks/gh-write.sh", "bash .xezar/checks/verdict-write.sh", "bash .xezar/checks/phase-record.sh", "bash .xezar/checks/worktree-setup.sh --readonly-init", "node .xezar/checks/review-run-app.mjs"]
