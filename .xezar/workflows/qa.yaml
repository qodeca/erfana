# Independent QA of a PR or its current head: exercise the change, verify the fix, post a
# verdict. Read-only like code-review: no setup, no gates, no commits. The verdict is posted with
# `gh` as a PR comment headed "## QA", never written into the tree. There is no readiness step, so
# `branch.owned-by-run` never applies to this role — reviewing another PR means checking its head
# out, which detaches HEAD, and a verdict-only role must never reach the check that refuses that
# (#356: independent QA always ended `failed` when it ran on `testing-and-verification` instead).
name: qa
description: "Independent QA of a PR or its current head: exercise the change, verify the fix, post a ## QA verdict comment and apply the SDLC QA-gate labels. Read-only."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: review
    name: QA
    prompt: "QA (see your skill for what to post and which labels to apply): {{task}} Report independence as confirmed, not confirmed or unknown, from the author the launch text names; never confirmed without that text."
    skill: xezar-qa
    verdictRole: qa
    allowedTools: [Read, Grep, Glob, Bash, mcp__chrome-devtools__navigate_page, mcp__chrome-devtools__new_page, mcp__chrome-devtools__list_pages, mcp__chrome-devtools__select_page, mcp__chrome-devtools__close_page, mcp__chrome-devtools__take_snapshot, mcp__chrome-devtools__take_screenshot, mcp__chrome-devtools__list_console_messages, mcp__chrome-devtools__get_console_message, mcp__chrome-devtools__list_network_requests, mcp__chrome-devtools__get_network_request, mcp__chrome-devtools__click, mcp__chrome-devtools__fill, mcp__chrome-devtools__fill_form, mcp__chrome-devtools__hover, mcp__chrome-devtools__press_key, mcp__chrome-devtools__type_text, mcp__chrome-devtools__wait_for, mcp__chrome-devtools__handle_dialog, mcp__chrome-devtools__resize_page, mcp__chrome-devtools__get_css_styles]
