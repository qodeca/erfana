# Research answers a question from sources OUTSIDE this repository and returns a cited,
# dated finding document (#276). It writes that document to the primary evidence directory
# and changes no source, so it has no setup, readiness, gates or evidence steps: the same
# kit -> preflight -> one agent step shape as business-analysis. No dependency install, no PR.
#
# `WebSearch` and `WebFetch` are listed on purpose. The engine's default tool list is
# Read/Edit/Write/Grep/Glob/Bash, and Claude runs headless with everything else denied, so
# without them this role could not reach the web at all and would silently become repo-only.
# `Edit` is left out: nothing here edits a file.
#
# The research step is the last step, so it stays interactive (XEZ:ASK / XEZ:DONE) and has
# no wall clock of its own.
name: research
description: Answer a question from sources outside this repository and return a cited, dated finding document. No code, no source change, no PR.
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Verify worktree isolation
    command: ".xezar/checks/worktree-preflight.sh"
    resultScope: routine
  - id: research
    name: Research, cite and report
    prompt: "{{task}}"
    skill: xezar-research
    allowedTools: [Read, Grep, Glob, Bash, Write, WebSearch, WebFetch, mcp__chrome-devtools__navigate_page, mcp__chrome-devtools__new_page, mcp__chrome-devtools__list_pages, mcp__chrome-devtools__select_page, mcp__chrome-devtools__close_page, mcp__chrome-devtools__take_snapshot, mcp__chrome-devtools__take_screenshot, mcp__chrome-devtools__click, mcp__chrome-devtools__fill, mcp__chrome-devtools__fill_form, mcp__chrome-devtools__hover, mcp__chrome-devtools__press_key, mcp__chrome-devtools__type_text, mcp__chrome-devtools__wait_for, mcp__chrome-devtools__handle_dialog, mcp__chrome-devtools__resize_page]
