version = 1
SPDX-PackageName = "erfana"
SPDX-PackageSupplier = "Qodeca sp. z o.o."
SPDX-PackageDownloadLocation = "https://github.com/qodeca/erfana"

# REUSE specification (https://reuse.software/spec-3.3/) coverage for files that
# cannot carry an inline SPDX header (markdown with line-1 frontmatter, JSON,
# lockfiles, binary assets). Source files carry inline `SPDX-License-Identifier`
# headers instead. Per-asset overrides (e.g. a third-party asset under a non-GPL
# license) are added as more specific [[annotations]] blocks, or via `.license`
# sidecar files, with precedence = "closest".

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Qodeca sp. z o.o."
SPDX-License-Identifier = "GPL-3.0-only"

# The Codex MCP configuration was copied in from an MIT-licensed agent kit. It
# keeps that kit's licence, not the project's.
[[annotations]]
path = [
  ".codex/config.toml",
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Qodeca", "2026 Open Mercato"]
SPDX-License-Identifier = "MIT"

# README and GitHub presentation assets (#139): the banner, the wordmark, the
# social preview and the demo loop. Copyright is GPL-3.0-only like the rest of the
# repository, but the Erfana name, icon and wordmark in them are trademarks of
# Qodeca sp. z o.o. (TRADEMARKS.md § Logos and brand assets): a renamed fork must
# replace them. The blanket block above already covers these files; this one
# records the trademark note next to them.
[[annotations]]
path = "docs/assets/readme/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Qodeca sp. z o.o."
SPDX-License-Identifier = "GPL-3.0-only"

# patches/node-pty+1.1.0.patch carries upstream node-pty source lines (MIT): the
# microsoft/node-pty#922 conpty.cc lock (#305) plus our build fixes to node-pty's
# own files. The diff text is node-pty code, so it keeps node-pty's licence.
[[annotations]]
path = "patches/node-pty+1.1.0.patch"
precedence = "override"
SPDX-FileCopyrightText = ["2017 Daniel Imms", "2018 Microsoft Corporation"]
SPDX-License-Identifier = "MIT"

# HTML Preview comment fixtures (docs/designs/comments/html-preview-comments.md § 12.3):
# golden blocks, compat pages, their .expected.json results, the SHA-256 lock
# and the agent-review pages. Most are byte-exact text that cannot carry an
# inline header without changing what they test (a .block.txt is exactly one
# serialized block; a .json file has no comment syntax), so this block records
# their licence. The blanket block above already covers them.
[[annotations]]
path = [
  "src/shared/htmlComments/__fixtures__/**",
  "e2e/fixtures/html-preview-corpus/comments/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Qodeca sp. z o.o."
SPDX-License-Identifier = "GPL-3.0-only"
