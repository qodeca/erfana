# Prose linter for the user-facing docs. Rules live in .vale/styles/Erfana/ and come from
# docs/user-guide/maintaining-this-guide.md, CLAUDE.md and
# docs/design-system/system/foundations/writing.html. Run: npm run lint:docs
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Erfana, Vale
# Bold text is an exact UI label copied from src/ ("Create new markdown file"), and the company
# name has a repeated "o": neither is prose to restyle.
TokenIgnores = (\*\*[^*\n]+\*\*), (sp\. z o\.o\.)
# Spelling and terms need a code-name dictionary; link text holds file paths (the-erfana-window).
# Both are left to review.
Vale.Spelling = NO
Vale.Terms = NO
