# Writing card and maintaining-this-guide.md: sentence case everywhere. Proper nouns stay capitalised.
extends: capitalization
message: "Use sentence case in the heading '%s'."
level: error
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  - Erfana
  - Claude
  - Claude Code
  - Markdown
  - Mermaid
  - GitHub
  - macOS
  - Linux
  - PDF
  - HTML
  - CSS
