<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Helvetica, Arial, sans-serif">
  <title>Harbour Street Community Garden – plot map</title>
  <rect width="640" height="420" fill="#e9e4d4"/>
  <rect x="20" y="20" width="600" height="380" fill="#cfdcb8" stroke="#6b5a3a" stroke-width="4"/>
  <!-- Path down the middle -->
  <rect x="300" y="20" width="40" height="380" fill="#d8c9a3"/>
  <!-- Plots, left column -->
  <g fill="#8fb46a" stroke="#4d6b35" stroke-width="2">
    <rect x="40" y="40" width="240" height="100"/>
    <rect x="40" y="160" width="240" height="100"/>
    <rect x="40" y="280" width="240" height="100"/>
  </g>
  <!-- Plots, right column -->
  <g fill="#8fb46a" stroke="#4d6b35" stroke-width="2">
    <rect x="360" y="40" width="240" height="100"/>
    <rect x="360" y="160" width="140" height="100"/>
    <rect x="360" y="280" width="140" height="100"/>
  </g>
  <!-- Greenhouse and compost -->
  <rect x="520" y="160" width="80" height="100" fill="#dfeef2" stroke="#5a7d88" stroke-width="2"/>
  <rect x="520" y="280" width="80" height="100" fill="#8a6a45" stroke="#5a4428" stroke-width="2"/>
  <g font-size="22" fill="#23331c" text-anchor="middle">
    <text x="160" y="97">A1</text>
    <text x="160" y="217">B1</text>
    <text x="160" y="337">C1</text>
    <text x="480" y="97">A2</text>
    <text x="430" y="217">B2</text>
    <text x="430" y="337">C2</text>
  </g>
  <g font-size="14" fill="#23331c" text-anchor="middle">
    <text x="560" y="215">Greenhouse</text>
    <text x="560" y="335" fill="#fdfbf5">Compost</text>
    <text x="320" y="415" font-size="12">Gate</text>
  </g>
</svg>
